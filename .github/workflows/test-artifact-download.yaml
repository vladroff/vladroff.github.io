name: "Test Artifact Download"
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Legis Run ID"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Download Artifact"
        uses: actions/download-artifact@v4
        with:
          name: legis-vitepress
          path: foo
          repository: vladroff/legis
          github-token: ${{ secrets.LEGIS_ACCESS_TOKEN }}
          run-id: ${{ inputs.run-id }}
      - run: ls -R **
