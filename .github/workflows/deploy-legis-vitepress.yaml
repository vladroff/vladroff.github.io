name: "Deploy Legis Vitepress"
on:
  repository_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls -R **
      - name: "Cleanup"
        run: rm -rf legis/*
      - run: ls -R **
      - name: "Download Artifact"
        uses: actions/download-artifact@v4
        with:
          name: legis-vitepress
          path: legis
          repository: vladroff/legis
          github-token: ${{ secrets.LEGIS_ACCESS_TOKEN }}
          run-id: ${{ github.event.client_payload.run_id }}
      - run: ls -R **
      - name: "Commit"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git commit -m "Legis Update"
          git push
